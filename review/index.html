<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06356d"><title>Review Pengurus — Buletin Jumat</title><link rel="stylesheet" href="../css/style.css"><style>.review-card{max-width:980px;margin:18px auto}.review-content h1{font:700 34px/1.15 Georgia,serif;color:var(--navy)}.review-content p{line-height:1.85}.review-meta{text-align:center}.review-error{max-width:700px;margin:70px auto}</style></head><body><div class="review-watermark">DRAFT<br>REVIEW PENGURUS</div><div class="review-banner">⚠️ DRAFT — REVIEW PENGURUS • Belum untuk dibagikan ke publik</div><div class="top"><div class="wrap"><span>Pengurus DKM Masjid At-Taubah BNN RI</span><span>REVIEW</span></div></div><header class="mast"><div class="wrap mast-inner"><div><img class="logo" src="../assets/logo-dkm.jpg" alt="Logo DKM"></div><div><div class="eyebrow">Buletin Jumat</div><div class="bigtitle"><span>MASJID</span><span>AT-TAUBAH</span></div><div class="brandline">BNN RI</div><div class="tagline">Pratinjau akhir sebelum diterbitkan.</div></div><div class="mast-quote">Versi ini khusus untuk pemeriksaan Pengurus.</div></div></header><main class="wrap page"><section id="state" class="card cardpad review-card"><div class="eyebrow" style="color:var(--blue)">Memuat review...</div></section><div id="content" class="hidden"></div></main><script>
const API='https://script.google.com/macros/s/AKfycbzlzU4MrICT-K2VKofOH6EZOzpnh1L8S2KmSnaTEIpApq619AzHram7COGBsvFhbdulrA/exec';
const q=new URLSearchParams(location.search),no=q.get('no')||'',token=q.get('reviewToken')||'';
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function paras(raw){return String(raw||'').split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('')}
function article(raw){let s=String(raw||''),out='',pos=0,re=/\[(AYAT|HADIS)\]([\s\S]*?)\[\/\1\]/gi,m;while((m=re.exec(s))){out+=paras(s.slice(pos,m.index));let l=m[2].trim().split(/\n+/).map(x=>x.trim()).filter(Boolean);out+='<div class="inserted-quote"><div class="inserted-label">'+(m[1].toUpperCase()==='AYAT'?'📖 AYAT SISIPAN':'📜 HADIS SISIPAN')+'</div><div class="ar">'+esc(l[0]||'')+'</div><div class="trans">“'+esc(l[1]||'')+'”</div><div class="src">'+esc(l[2]||'')+'</div></div>';pos=m.index+m[0].length}out+=paras(s.slice(pos));return out}
function decision(d){const note=document.getElementById('note').value.trim();if(d==='revisi'&&!note){document.getElementById('decisionMsg').innerHTML='<div class="notice">Isi catatan revisi terlebih dahulu.</div>';return}fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'reviewDecision',no,reviewToken:token,decision:d,note})}).then(r=>r.json()).then(x=>{document.getElementById('decisionMsg').innerHTML='<div class="'+(x.ok?'info':'notice')+'">'+esc(x.message)+'</div>';if(x.ok){document.querySelector('.review-actions').style.display='none';}}).catch(e=>document.getElementById('decisionMsg').innerHTML='<div class="notice">'+esc(e.message)+'</div>')}
function render(e){const ref=String(e.reflection||'').split(/\n+/).filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('');document.getElementById('content').innerHTML='<div class="edbar"><div class="wrap"><span>EDISI '+esc(e.no)+'</span><span>'+esc(e.date)+'</span><span>REVIEW PENGURUS</span></div></div><main class="wrap page review-content"><section class="card ayah"><div class="ribbon">📖 AYAT JUMAT</div><div class="ayahbody"><div class="ar">'+esc(e.ayah)+'</div><div class="trans">“'+esc(e.ayahTrans)+'”</div><div class="src">'+esc(e.ayahRef)+'</div></div></section><section class="card" style="margin-top:18px"><div class="ribbon">📜 HADIS PILIHAN</div><div class="hadithbody"><div class="ar">'+esc(e.hadith)+'</div><p class="trans">“'+esc(e.hadithTrans)+'”</p><div class="src">'+esc(e.hadithRef)+'</div></div></section><article class="card cardpad article" style="margin-top:18px"><div class="ribbon">🌿 RENUNGAN UTAMA</div><h1>'+esc(e.title)+'</h1><div class="by">Redaksi DKM At-Taubah</div>'+article(e.article)+'</article><section class="card reflection cardpad" style="margin-top:18px"><div class="ribbon">💡 UNTUK DIRENUNGKAN</div><ul>'+ref+'</ul></section><section class="card doa cardpad" style="margin-top:18px"><div class="ribbon">🤲 DOA JUMAT</div><div class="ar small">'+esc(e.doa)+'</div><p class="trans">“'+esc(e.doaTrans)+'”</p><div class="src">'+esc(e.doaRef)+'</div></section><section class="card cardpad" style="margin-top:18px"><div class="ribbon">🔎 KEPUTUSAN PENGURUS</div><p>Setelah membaca seluruh edisi, Pengurus dapat memilih persetujuan atau meminta revisi.</p><label>Catatan (opsional)<textarea id="note" class="admin-area" style="min-height:120px" placeholder="Catatan untuk Redaksi..."></textarea></label><div class="review-actions"><button class="btn" onclick="decision('revisi')">↩️ Kembalikan ke Redaksi</button><button class="btn primary" onclick="decision('approve')">✅ Setujui Edisi</button></div><div id="decisionMsg"></div></section><div class="review-actions"><a class="btn" href="../admin/">⬅️ Kembali ke Admin</a></div></main>';document.getElementById('state').classList.add('hidden');document.getElementById('content').classList.remove('hidden')}
function loadReview(){
  if(!no||!token){
    document.getElementById('state').innerHTML='<div class="notice">Link review tidak lengkap.</div>';
    return;
  }

  const cb='reviewCallback_'+Date.now();
  const script=document.createElement('script');
  let finished=false;

  window[cb]=function(d){
    if(finished)return;
    finished=true;
    try{
      if(!d||!d.ok)throw new Error((d&&d.message)||'Review tidak dapat dimuat.');
      render(d.edition);
    }catch(e){
      document.getElementById('state').innerHTML=
        '<div class="notice">'+esc(e.message||'Review tidak dapat dimuat.')+'</div>';
    }
    cleanup();
  };

  function cleanup(){
    try{delete window[cb]}catch(_){}
    if(script.parentNode)script.parentNode.removeChild(script);
  }

  script.onerror=function(){
    if(finished)return;
    finished=true;
    document.getElementById('state').innerHTML=
      '<div class="notice">Gagal terhubung ke backend Review Pengurus.</div>'+
      '<p style="margin-top:12px;color:#667085">Pastikan deployment Apps Script sudah versi terbaru.</p>';
    cleanup();
  };

  script.src=API+
    '?action=reviewEdition'+
    '&no='+encodeURIComponent(no)+
    '&reviewToken='+encodeURIComponent(token)+
    '&callback='+encodeURIComponent(cb)+
    '&_='+Date.now();

  document.body.appendChild(script);

  setTimeout(function(){
    if(finished)return;
    finished=true;
    document.getElementById('state').innerHTML=
      '<div class="notice">Backend belum merespons.</div>'+
      '<p style="margin-top:12px;color:#667085">Jika Code.gs baru saja di-deploy, tunggu beberapa detik lalu buka link review baru.</p>';
    cleanup();
  },15000);
}
loadReview();
</script></body></html>
