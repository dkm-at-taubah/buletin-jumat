<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06356d"><title>Review Pengurus — Buletin Jumat</title><style>body{margin:0;background:#eef6fd;font-family:Arial,sans-serif;color:#243447}.bar{background:#fff4cc;color:#684d00;padding:20px;text-align:center;font-weight:800;font-size:18px}.box{max-width:680px;margin:60px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 30px #164a6d18;text-align:center}.spin{margin:20px auto;width:34px;height:34px;border:4px solid #dbe8f4;border-top-color:#0877d1;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#b42318;line-height:1.6}</style></head><body><div class="bar">⚠️ DRAFT — REVIEW PENGURUS • Belum untuk dibagikan ke publik</div><div class="box"><div class="spin"></div><h2>Membuka Review Pengurus…</h2><p>Mohon tunggu sebentar.</p><div id="err"></div></div><script>(function(){const p=new URLSearchParams(location.search),no=p.get('no')||'',token=p.get('reviewToken')||'';if(!no||!token){document.getElementById('err').innerHTML='<div class="err">Link review tidak lengkap.</div>';return;}const app='https://script.google.com/macros/s/AKfycbzlzU4MrICT-K2VKofOH6EZOzpnh1L8S2KmSnaTEIpApq619AzHram7COGBsvFhbdulrA/exec';location.replace(app+'?action=reviewPage&no='+encodeURIComponent(no)+'&reviewToken='+encodeURIComponent(token)+'&_='+Date.now());})();</script></body></html>
